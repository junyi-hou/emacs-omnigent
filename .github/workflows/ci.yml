name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Emacs ${{ matrix.emacs }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs: ['30.2', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Install Emacs test dependencies
        run: make test-deps

      - name: Run unit tests
        run: make unit-test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install integration dependencies
        # The unit test steps already ran test-deps on this runner.
        run: make -o test-deps integration-deps

      - name: Run integration tests
        run: make integration-test
