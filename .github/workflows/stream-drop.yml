name: Stream drop recovery

on:
  pull_request:
    paths:
      - '.github/workflows/stream-drop.yml'
      - 'Makefile'
      - 'omnigent*.el'
      - 'test/integration/omnigent-integration-fixture.el'
      - 'test/integration/fixtures/omnigent-integration-stream-drop-test.el'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install integration dependencies
        run: make integration-deps

      - name: Run stream-drop integration test
        run: make integration-test INTEGRATION_TEST_FILES=test/integration/fixtures/omnigent-integration-stream-drop-test.el
